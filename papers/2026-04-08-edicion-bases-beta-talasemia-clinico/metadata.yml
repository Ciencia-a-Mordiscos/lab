titulo_corto: "5 pacientes con β-talasemia, 23 meses sin transfusiones"
card_descripcion: |
  Lai et al. (2026) reportan el primer trial Fase 1 (NCT06024876, **N=5**) de un *base editor* clínico (CS-101) que desactiva el sitio donde el represor BCL11A apaga la hemoglobina fetal. Tras la infusión de células CD34+ propias editadas, los **5 pacientes dejaron las transfusiones** (mediana 18 días a la última). La hemoglobina total a 3 meses fue **12,4 ± 1,0 g/dl** (cálculo propio reproduce: 12,44 ± 1,04), dentro del rango normal adulto. La HbF subió **31×** desde el baseline (0,41 → 12,77 g/dl al mes 12). En las réplicas pareadas in vitro, la edición pasó de **4 alelos por cada 10.000 (NT) a 6 de cada 10 (Editadas)** — Wilcoxon signed-rank pareado: W=15, p=0,031 unilateral, Cohen's dz=68,7. La edición se mantiene estable en sangre periférica entre **26-54%** durante 21 meses, lo que sugiere que las células madre verdaderas heredaron el cambio. **3 de los 5 pacientes son β0/β0** (no producen ninguna β-globina endógena): su sangre es **99-100% hemoglobina fetal** y aun así viven sin transfusiones — un regreso evolutivo dirigido. ⚠️ N=5, single-arm, sin grupo control: eficacia clara dentro del trial pero NO comparable contra otras terapias (Casgevy, lentiviral, alogénico) sin head-to-head. Mediana 23 meses → seguimiento intermedio, no "a largo plazo". Eventos adversos consistentes con busulfán mieloablativo (no triviales). 0 muertes y 0 cánceres en el seguimiento.
