card_descripcion: |
  Hong et al. (2026) reclutaron 31 voluntarios que vinieron en ayunas, los dejaron comer durante 6 horas lo que quisieran (sin menú impuesto) y midieron cómo cambiaron sus células T entre las dos extracciones — más 6 controles que comieron continuamente o ayunaron continuamente. El hallazgo: comer aumenta la **capacidad metabólica de las células T** (más OCR mitocondrial, más IFN-γ y TNF), el efecto **persiste 7 días *in vitro* y hasta 40 semanas en ratones**, y los **quilomicrones** (lipoproteínas postprandiales) son el vehículo que lo transmite vía LDLR y mTORC1. Punto traslacional: las **células CAR-T fabricadas con sangre postprandial son terapéuticamente superiores**. Lo que abrimos aquí: la demografía pública (Tablas S1+S2) de los 37 participantes. Mediana de ayuno **13 h**, cumplimiento del protocolo 12–14 h del **68%** (21/31), BMI mediano **23,8 kg/m²** (rango 19–41 sin el outlier por error de transcripción), y elección dietaria diversa: **13 grasas, 11 carbohidratos, 5 proteínas, 2 vegetales**. ⚠️ Las mediciones funcionales del paper (OCR, ECAR, citoquinas, CAR-T) viven en figuras — no como CSVs descargables — así que el notebook se centra en el diseño humano del estudio. ⚠️ Cohorte n=31 de un solo centro (Pittsburgh). ⚠️ Corrección publicada (2026-05-14) sobre etiquetas de Fig 3h; conclusión cualitativa intacta.
