titulo_corto: "La deforestación baja el umbral climático del Amazonas en 2 °C (según el modelo)"
card_descripcion: |
  Wunderling et al. (2026) corren PyCascades — un modelo dinámico del Amazonas — sobre una grilla de **416 celdas de 1° × 1°** y **1,25 millones de simulaciones** (3.000 réplicas × 10 ensembles) bajo cuatro escenarios SSP. Sin deforestación, el modelo proyecta el umbral del bosque entre **3,7 y 4,0 °C** de calentamiento. Con la deforestación de tipo *Business as Usual* (22-28 % del bioma), el umbral cae a **1,5–1,9 °C** — exactamente el rango donde apunta la meta del Acuerdo de París. El contraste es brutal en SSP1-2.6 (+1,8 °C, el escenario más cercano a París): **0 % del Amazonas en transición sin deforestación**, **62 % con deforestación BaU** — 62 puntos porcentuales que dependen sólo del escenario de uso del suelo. A 4 °C la brecha se reduce a 43 pp porque el sistema climático ya empuja por su cuenta. ⚠️ Es un modelo de simulación, no observación. El paper habla siempre en términos de proyección y riesgo. ⚠️ El moisture recycling validado contra ERA5 muestra +5,5 % de sesgo (R² = 0,59); se basa en NorESM2 y otros modelos climáticos podrían arrojar umbrales distintos.
