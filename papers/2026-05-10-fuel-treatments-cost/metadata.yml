titulo_corto: "Cuánto pagó limpiar bosques antes del fuego: $1 → $3,73"
card_descripcion: |
  Strabo et al. (2026) integraron datos de alta resolución sobre incendios MTBS, tratamientos forestales (FACTS), esfuerzo de supresión y daños en el oeste de EEUU para responder una pregunta directa: ¿pagan los **fuel treatments**? Aplicando un diseño cuasi-experimental espacial (DiD) sobre 700 tratamientos cruzados con incendios reales entre 2017 y 2023, encontraron que **cada $1 invertido devolvió $3,73 en beneficios esperados** — y las 6 especificaciones de robustez van de $1,93 a $4,28, todas por encima del break-even. Total: **$2.800 millones en daños evitados** por menor pérdida de estructuras, menos emisiones de CO₂ y menos exposición a PM2.5. ⚠️ Diseño cuasi-experimental, no RCT — la identificación causal viene de la exogenidad espacial. ⚠️ California aporta 30% de los incendios con datos de emisiones; extrapolar al Mediterráneo o Australia requiere más trabajo. ⚠️ Las muertes (10.321 atribuidas a humo) son atribuciones modeladas (Wen 2023), no certificados de defunción. ⚠️ El desglose de los $2.800M por componente vive en el paper, no en los CSVs procesados.
