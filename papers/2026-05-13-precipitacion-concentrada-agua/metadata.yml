titulo_corto: "El 100% del planeta responde igual a la lluvia más concentrada: con menos agua"
card_descripcion: |
  Lesk & Mankin (2026) construyeron índices de **concentración Gini** (Gp) — qué tan desigual cae la lluvia anual en eventos diarios — para cada celda de 0.5° del land surface global, 1980-2022. Regresión panel: ¿qué le pasa a las reservas hídricas terrestres (TWS) cuando sube la Gini, manteniendo constante la precipitación total? Resultado: **100% de las 259.200 celdas** tienen respuesta negativa (más Gini → menos agua), mediana **-21,5 mm de TWS por unidad de Gini**. El efecto secante es **comparable** al humectante de la precipitación total — ratio promedio entre 3 productos independientes (CPC, GPCC, GPCP) ≈ **0,59**. De las **494 cuencas hidrográficas** analizadas (R² mediana 0,92), **28,3%** muestran drying significativo vs **15,4%** wetting significativo. Y la proyección a **+2°C** dice que la concentración sube en **100%** del land surface (mediana +0,0315 /K). ⚠️ Las regresiones son correlacionales; la causalidad descansa en modelos hidrológicos idealizados. ⚠️ El ratio efecto-secante/humectante varía 2,3× entre productos (0,35 a 0,81) — la magnitud comparable es robusta, pero el valor puntual no. ⚠️ Contraintuitivo: **82,4%** del globo en 1980-2022 vio la concentración Gini **bajando** — el efecto fuerte está en la proyección, no en el presente.
