titulo_corto: "Humedales y metano: 28 modelos, el mismo veredicto"
card_descripcion: |
  Zhang et al. (2026) corrieron un ensamble de **7 modelos terrestres × 4 forzantes climáticos = 28 simulaciones** del metano natural de humedales 2006-2099 bajo calentamiento alto. **Los 28 caminos aumentan** — la mediana global pasa de **224,5 Tg CH₄/año (2010s) a 327,6 Tg/año (2090s)**, un **+53,9 %** (P17-P83: 37-64 %). Los autores filtran ese ensamble con **163 años-sitio de torres de flujo (eddy-covariance)** y obtienen la cifra titular del paper: **50-60 % más emisiones por los 2090s**. Nuestra mediana cruda cae justo en esa banda. La descomposición regional muestra el contraste: **los trópicos aportan 72 % del aumento absoluto** (81,6 Tg/año), pero la región boreal **duplica sus emisiones** (+102 %) — el mayor cambio relativo del planeta, aunque pequeño en términos absolutos (7,2 Tg/año). Solo en la década 2030, el aumento adicional ya equivale a **9 % del CH₄ humano de 2020 (380 Tg)**, "comparable" — dice el paper — a lo que el **Global Methane Pledge** (recorte 30 %) prometió eliminar. ⚠️ Cubre alrededor de un tercio del recorte humano comprometido, no la totalidad. ⚠️ El filtro emergente no es replicable con los datos públicos (requiere series de temperatura de cada ESM). ⚠️ La cobertura observacional está sesgada a latitudes medias y altas — los trópicos, donde está la mayor masa del aumento, son justo donde queda más incertidumbre.
