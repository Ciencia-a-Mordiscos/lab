titulo_corto: "Un péptido modular contra MRSA — 99,500× más potente que vancomicina"
card_descripcion: |
  Garrood et al. (2026) construyeron un péptido **modular de tres piezas** — ancla bifenilo + enlazador difenilalanina + cabeza catiónica — y probaron 7 anclas distintas sobre el mismo esqueleto contra MRSA. Bajamos las **Source Data Figs. 1, 2 y 4** del paper (4 CSVs, n=3 réplicas in vitro y n=3 ratones por dosis in vivo) y las desmenuzamos. **Acto 1:** a **128 μM**, Bip-FK9 deja MRSA en **100 CFU/mL** (límite de detección) mientras vancomicina sigue dejando **9,95 millones de CFU/mL** — diferencia de **~99.500×**. **Acto 2:** el ancla importa — las otras 6 variantes se quedan en el rango 1,3×10⁹–5,4×10⁹ CFU/mL; Bip-FK9 baja a 1,6×10⁷ (80× por debajo del siguiente mejor, Iso-FK9). **Acto 3:** PG (fosfatidilglicerol) es el blanco — solo PG libre bloquea la actividad (reducción 0,04 log) mientras CL, PA y Lysyl-PG no protegen (reducción 2,3–2,7 log). **Cierre in vivo:** la carga bacteriana pulmonar en ratones con neumonía MRSA cae de **82,4%** (0,5 μg/mL inhalado) a **1,4%** (24 μg/mL). ⚠️ n=3 por dosis (in vitro e in vivo). ⚠️ Eje Y in vivo en porcentaje según convención del paper (carga relativa al control), no CFU absolutos. ⚠️ Body del paper en paywall — verificación cruzada limitada al supplementary accesible. ⚠️ Resistencia tras pases y toxicidad histológica son claims del paper sin CSV propio en el Lab.
