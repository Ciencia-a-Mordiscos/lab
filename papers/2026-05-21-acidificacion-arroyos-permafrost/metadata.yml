titulo_corto: "Cuando el permafrost se derrite y los arroyos se vuelven ácido sulfúrico"
card_descripcion: |
  Skierszkan et al. (2026) **documentan** un fenómeno geoquímico abrupto: al deshelarse el permafrost en cabeceras de los ríos Yukon y Mackenzie, los sulfuros minerales del bedrock se oxidan al aire por primera vez en milenios, generando ácido sulfúrico y liberando metales pesados a concentraciones tóxicas. Bajamos los datos del preprint EarthArXiv (Open Access) — Table S1, Figura S8F y series ECCC — y los desmenuzamos en tres niveles. **Las surgencias** (n=10): pH mediano **3,1** (rango 2,7–6,1) — el mismo rango del drenaje ácido de minas, pero natural. **Los arroyos receptores** (KM99/KM71/KM175, 156 muestras): cadmio supera el umbral CCME en **92–100% de las muestras** en los tres, zinc en 98%/57%/100%. La heterogeneidad refleja qué minerales sulfurosos contiene cada bedrock. **Los ríos grandes** corriente abajo (Peel, Ogilvie, Klondike): pH casi neutro (~8), pero **sulfato subiendo de forma sostenida** durante décadas — el Peel duplicó su tasa desde 2000. Dawson City se calienta **+0,04 °C/año** (p<0,001, 1961–2024). ⚠️ Estudio observacional, la causalidad climática es inferida químicamente sólida pero no aislada experimentalmente. ⚠️ n=10 surgencias frente a "decenas" del paper. ⚠️ La proyección regional (más allá del TWO) es extrapolación basada en litologías + datos históricos.
