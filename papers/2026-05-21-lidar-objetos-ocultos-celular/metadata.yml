card_descripcion: |
  Somasundaram et al. (2026) demuestran **NLOS imaging (imaging non-line-of-sight)** sobre un sensor de mercado — el ST VL53L8CX, un multizone time-of-flight de menos de US$100, no el LiDAR del iPhone — para localizar objetos ocultos detrás de una pared con un error promedio de **3,8 cm** (vs 6,4 cm de *backprojection* y 15,7 cm de *phasor field*, los dos baselines clásicos del campo). El truco: el modelo MAS (*motion-induced aperture sampling*) que combina muchos cuadros aprovechando que cámara y objeto se mueven. Abrimos las dos tablas del Supplementary (errores por método y por dimensión) más el histograma SPAD y la trayectoria del particle filter sobre 475 cuadros (95 s a 5 fps). El titular esconde un matiz importante: los 3,8 cm son el promedio sobre 25.000 ensayos — la incertidumbre en un cuadro individual ronda los **24 cm**. La diferencia es estadística pura (el error promedio escala con √N) y el notebook la separa explícitamente. ⚠️ Solo 2 baselines comparados. ⚠️ Objetos planos en escenas controladas. ⚠️ Conocer la forma del objeto reduce el error hasta 2,5× (efecto fuerte en objetos no convexos como la "U").
