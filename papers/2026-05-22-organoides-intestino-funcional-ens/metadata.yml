titulo_card: "Hicieron crecer un intestino humano de 8 cm. En 10 semanas"
card_descripcion: |
  Park et al. (2026) inventaron un truco simple: una bandeja impresa en 3D que **confina físicamente** los esferoides mientras crecen. Con esa restricción, los organoides desarrollan solos su propio sistema nervioso entérico — el que controla la contracción del intestino. Bajamos los CSVs de Source Data (Figs. 1f, 3f-g, 5c, 5f, 6j y Extended Data 1j-l) y los desmenuzamos. **Acto 1:** misma jugada en tres órganos distintos — **intestino delgado ~7×**, **colon ~12×**, **estómago ~12×** en tamaño de injerto a 10 semanas (Mann-Whitney p≤0,004, Cohen's d entre 2,3 y 3,8). **Acto 2:** los nervios funcionan. La tetrodotoxina apaga la contracción (Wilcoxon pareado p=0,008, d pareado=0,99); la combinación L-NAME + atropina la apaga también (p=0,001), confirmando componentes excitatorios colinérgicos e inhibitorios nitrérgicos en el ENS desarrollado de novo. **Acto 3:** al conectar el injerto al lumen del huésped, la barrera no aumenta su permeabilidad (Mann-Whitney p=0,057, Cohen's d=4,0 — tendencia clara con n=3 vs 4, intervalo amplio). ⚠️ La anchura de 8 cm vive en el abstract — el Source Data Fig 1f es área en cm², no longitud lineal. ⚠️ L-NAME solo no alcanza significancia (p=0,195) — la confirmación de neuronas nitrérgicas se apoya en el contraste L-NAME vs L-NAME+atropina. ⚠️ Trasplante en rata RRG inmunocomprometida — el salto a clínica humana sigue lejos.
