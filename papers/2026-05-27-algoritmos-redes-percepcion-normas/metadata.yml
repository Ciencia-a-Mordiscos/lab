titulo_corto: "Algoritmos que distorsionan lo que crees que piensan los demás"
card_descripcion: |
  Brady et al. (2026) construyeron dos feeds de redes sociales desde cero —uno ordenado por engagement como las plataformas reales, otro cronológico simple— y asignaron al azar a **1.818 personas** a usar uno u otro durante **8 semanas**, antes y después de las elecciones de Estados Unidos en 2024. **Acto 1:** la dieta cambia — el feed algorítmico casi **duplica** la exposición al contenido del propio bando alabándose (de **14% a 24,6%**) y reduce a un tercio la exposición al otro bando (de **28% a 9,9%**). **Acto 2:** cambia lo que la gente CREE — con un efecto medio (**Cohen's d = 0,346**, p = 1,1 × 10⁻¹³), los usuarios del feed algorítmico creen que más gente alaba públicamente al propio bando. **Acto 3:** dos sorpresas — el algoritmo **redujo** la percepción de extremismo del entorno (d = -0,19) y la polarización afectiva (d = -0,13). Direcciones inesperadas, pequeñas pero significativas. ⚠️ Solo Estados Unidos, una elección, 8 semanas. ⚠️ Los participantes sabían que estaban en un experimento. ⚠️ La tercera condición del paper (algoritmo "diversified extremity") no está en el CSV abierto.
