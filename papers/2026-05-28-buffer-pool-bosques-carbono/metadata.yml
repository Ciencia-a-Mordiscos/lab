titulo_corto: "El buffer del mercado de carbono forestal: probablemente 6,3 veces más pequeño de lo que el clima exige"
card_descripcion: |
  Badgley et al. (2026) construyeron un modelo de riesgo de pérdida de carbono a 100 años para los 95 supersections forestales de Estados Unidos continental combinando inventario, satélite, disturbance modelling y machine learning. Bajamos las 4 tablas de Source Data (Figs. 1, 3 y 4) y las desmenuzamos. **Acto 1:** el fuego es el único disturbio que responde fuerte al cambio climático — pasa de **13% a 35%** de probabilidad media a 100 años (**+22 pp, +171% relativo**); sequía e insectos suben mucho menos. **Acto 2:** **Sierra Nevada** suma 85 puntos porcentuales adicionales de riesgo combinado por clima; California y el Intermountain West dominan el top 10, pero también aparecen Blue Ridge y Laurentian. **Acto 3:** sobre los 116 proyectos reales del programa CARB, **79% tienen riesgo natural mayor que su buffer** y en **61% solo el fuego ya se come el colchón**. El factor promedio de subdimensionamiento del buffer pool es **6,3×** (rango 2,2–8,0× según escenario). ⚠️ Es paper de modelado, no observación. ⚠️ El riesgo combinado puede superar 100% porque los disturbios pueden ocurrir secuencialmente en un siglo. ⚠️ El 6,3× es promedio entre 7 escenarios de sensibilidad — la decisión de política depende de cuál se considere relevante.
