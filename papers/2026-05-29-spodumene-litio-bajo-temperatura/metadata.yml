titulo_corto: "Litio para baterías sin tostar la roca"
card_descripcion: |
  Mowbray et al. (2026) plantean otra ruta para sacar litio del espodumeno — el mineral más abundante de Li para baterías. En vez de tostarlo a más de 1.000 °C y atacarlo con ácido sulfúrico, lo disuelven con fluoruro de amonio (NH₄F) en agua, a menos de 100 °C, en un circuito cerrado que regenera el reactivo. Bajamos las 7 tablas del Supplementary y desmenuzamos. **Acto 1:** el proceso opera a **<100 °C vs >1.000 °C** del incumbente — factor ~12× en temperatura operativa, diferencia categórica entre hidro y pirometalurgia. **Acto 2:** lo probaron en **17 muestras de 4 países** (Australia, USA, Brasil, Canadá) y **13 tipos de feedstock** — desde tailings con 0,8% Li₂O hasta concentrados premium con 7,2% — con **recuperación de litio mediana del 99%** (rango 95–103%, 17/17 ≥95%). **Acto 3:** el balance termodinámico de las 11 reacciones balanceadas es **−7.657 kJ/mol neto exotérmico** — el proceso libera más calor del que necesita, lo que explica fisicoquímicamente por qué funciona sin horno externo. La pureza del Li₂CO₃ resultante es **99 ± 0,6%**, equivalente al Alfa Aesar 99,999% que midieron en 98,9%. ⚠️ El TEA proyecta **>40% reducción de costo**, pero es proyección — *may reduce*, sin planta piloto que confirme. ⚠️ Los yields >100% en Al (hasta 132%) y Si (hasta 103%) son artefactos de inhomogeneidad del feedstock, no exceso real. ⚠️ La sensibilidad al precio del NH₄F es alta — si sube a 1.500 USD/t, los márgenes se comprimen.
