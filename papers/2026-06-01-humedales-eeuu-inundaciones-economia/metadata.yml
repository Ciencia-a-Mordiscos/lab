titulo_corto: "Humedales aguas arriba: 10 mil millones de dólares en reclamos por inundaciones"
card_descripcion: |
  Gourevitch, Gold & Garcia (2026) cruzaron 38 años de mapas anuales de humedales en Estados Unidos con cada reclamo del seguro federal de inundaciones (NFIP), usando regresión de panel con efectos fijos por subcuenca HUC12 — 83.359 unidades en total. Bajamos los datos del Supplemental de Zenodo (172 MB, 218 columnas) y los desmenuzamos en 4 CSVs agregados. **Acto 1:** la pérdida de humedales 1985-2023 sumó **US$10,12 mil millones** en reclamos adicionales (IC 95%: US$8,12-12,07B), equivalentes al **9,0%** del total nacional NFIP del periodo — el paper lo enmarca como estimación, no como hallazgo causal puro (panel observacional). **Acto 2:** la pérdida está extremadamente concentrada. **Tres regiones costeras** (Tejas-Golfo, Sureste y Misisipi Bajo) acumulan **97% del costo** (US$9,84B de US$10,12B); las **95 subcuencas** con pérdida >500 ha cada una (0,11% del total) concentran **44,6% del costo total**. La narrativa común de "se perdieron humedales en todo el país" se cae con los datos: el motor del daño no es la pérdida promedio, son outliers en costas de baja altitud. **Acto 3:** solo el **16,1%** de las subcuencas justifica conservar humedales económicamente (BCR ≥ 1) — pero la geografía del retorno no coincide con la geografía del daño. Mid-Atlántico tiene **49,5%** de subcuencas rentables (mejor proporción regional), Tennessee llega a **70,4%** con muchas menos subcuencas, mientras que las regiones que más perdieron (Tejas-Golfo, Sureste) tienen BCR ≥ 1 solo en 13-14% de sus subcuencas. ⚠️ El paper modela elasticidad sobre pérdida, no afirma simetría de beneficio para restauración. ⚠️ NFIP no captura todo el daño económico (sub-cobertura del seguro federal). ⚠️ El NPV total cae **6,6×** entre 1% y 7% de tasa de descuento — alta sensibilidad al horizonte temporal de la valoración política.
