titulo_corto: "Tu teléfono ya te toma el pulso"
card_descripcion: |
  Liu et al. (2026) entrenaron PHRM, un modelo de deep learning que mide frecuencia cardíaca leyendo el rubor sutil que tu pulso le imprime a la piel desde la cámara frontal del celular — *remote photoplethysmography* (rPPG). El problema histórico de esta técnica: fallaba casi 4× más en piel oscura (MAE 3,4 → 13,6 bpm de Fitzpatrick I-V a VI según el meta-análisis Dasari 2021). Tomamos las cifras del Supplementary y las miramos una por una. **Acto 1:** PHRM-full logra **MAPE 3,8% / 4,4% / 8,9%** (piel clara / media / oscura, laboratorio) — los tres grupos cumplen el estándar industria <10% por primera vez en rPPG sobre smartphone. **Acto 2:** comparado con Savur (método previo), PHRM mide piel oscura **3,2× mejor en vida cotidiana** (24,8% → 7,8% MAPE). Y lo hace con **498K parámetros** — el modelo más pequeño del benchmark de 8 modelos rPPG (14,8× menos que PhysFormer). **Acto 3:** corre en Pixel 3 (2018) a **402 ms por ventana de 10 s** y en Pixel 7 a **133 ms** — 3× más rápido en 4 generaciones, sigue siendo portable a hardware viejo. ⚠️ El modelo **liberado** (PHRM-mini) no es el del abstract — cruza el 10% MAPE en 2 de 3 grupos en vida cotidiana (11,1% piel clara, 13,1% piel oscura). ⚠️ El 31,5% Fitzpatrick VI aplica a la cohorte de 340 personas con tono declarado, no al cohorte de 485 del abstract. ⚠️ El dataset crudo está restringido por el comité de ética (IRB) — no se reproduce desde cero. ⚠️ Validación observacional: PHRM se asocia con factores de riesgo cardiovascular pero NO los predice ni diagnostica.
