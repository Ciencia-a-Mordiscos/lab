titulo_corto: "Un marcapasos sin cirugía: ultrasonido + un canal bacteriano"
card_descripcion: |
  Wei et al. (2026) presentan un marcapasos no invasivo (NUP) que combina un canal mecanosensible de bacteria (MscL-G22S) transducido al corazón con ultrasonido focalizado externo. Bajamos los Source Data Fig. 2 y Fig. 3 (in vitro + dosis-respuesta + in vivo en rata) y reproducimos los efectos centrales. **Acto 1 (in vitro):** en 4 grupos de cardiomiocitos humanos transducidos, la fluorescencia de Ca²⁺ durante el ultrasonido sube **entre 4 y 29 veces** respecto al basal y vuelve cuando el estímulo termina — Cohen's d pareado de **2,57 a 9,74**, Wilcoxon p ≤ 10⁻³ en los 4 grupos. **Acto 2 (dosis-respuesta):** la tasa de éxito del pacing cruza el 50% a ~**1,6 MPa** y satura a ~**2,2 MPa (98% éxito)**, con n=30 réplicas por presión barriendo 5 duraciones de pulso (10–80 ms). **Acto 3 (in vivo):** en los 3 trials de rata cuyas métricas son comparables (j, k, n; 35 latidos), los intervalos entre latidos durante el ultrasonido son **64% más largos** que el ritmo basal (Wilcoxon pareado p ≈ 10⁻⁷, Cohen's d pareado **= 1,69**) y vuelven al baseline al apagar el dispositivo (p=0,51). ⚠️ Validado *in vitro* (cardiomiocitos humanos), *in vivo* (ratas), *ex vivo* (cerdo) — **NO** en humanos vivos. ⚠️ Requiere terapia génica para insertar el canal MscL-G22S en el corazón. ⚠️ Source Data publica solo 3 de 7 trials *in vivo* comparables — la generalidad del fenómeno queda con esa ventana.
