titulo_corto: "Cooperación vs. igualdad al repartir bienes públicos"
card_descripcion: |
  Un modelo de teoría de juegos sobre **50 redes sociales reales** compara dos formas de repartir un bien público: **uniforme** (todos reciben lo mismo) vs **equitativa** (en proporción al aporte). **El hallazgo:** repartir por igual facilita más la cooperación en **40 de 50 redes (80%)**, pero a costa de triplicar la desigualdad — el Gini del beneficio sube de **0,10 a 0,33**, mientras que el reparto equitativo lo mantiene en **≈0**. En una red dispersa de ejemplo, bajo reparto uniforme **48 de 50 personas quedan peor que sin cooperar** y un solo nodo muy conectado se lleva **+5,6**. ⚠️ Es un modelo teórico: los mecanismos son causales solo dentro del modelo, no una medición de sociedades humanas reales. ⚠️ La 'inevitabilidad' de la desigualdad está atenuada en el paper ('may be') — decimos 'podría ser'. ⚠️ Las diferencias de umbral entre reglas son pequeñas (<2%); lo robusto es el contraste de igualdad (Gini).
