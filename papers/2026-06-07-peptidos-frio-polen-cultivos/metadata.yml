titulo_corto: "Una helada en flor: los péptidos que salvan la cosecha"
card_descripcion: |
  Una noche de frío durante la floración puede dejar estéril un cultivo entero: el polen aborta y no hay grano. El equipo identificó en el tomate dos péptidos diminutos —**SlRGF9** y **SlRGF10**— que se encienden con el frío y protegen el polen. Bajamos los Source Data de viabilidad de polen y de rendimiento. **El hallazgo:** apagar los dos péptidos con CRISPR hunde la viabilidad del polen bajo frío de ~0,99 a **0,43** (caída del 56,6 %, Cohen's d = 6,4); apagar uno solo apenas afecta — se respaldan mutuamente. Subirlos dispara la cosecha de tomate (**+64 % y +99 %**), y el mismo truco recupera grano en arroz, una planta separada del tomate hace 150 millones de años. ⚠️ Muestras pequeñas (n=4–6). ⚠️ Rendimientos en unidad relativa, no kg/hectárea de campo. ⚠️ De tres líneas de arroz, una (L1) rinde por debajo del silvestre; el efecto real está en L2 y L3 (+16 %).
