card_descripcion: |
  Los datos de migración son escasos y cada país los define distinto. Un equipo entrenó un **conjunto de redes neuronales** para reconstruir, año por año, cuánta gente se movió entre **231 países** desde 1990 — con una **banda de incertidumbre** pegada a cada cifra. **El hallazgo:** el flujo migratorio global anual **pasó de 15,2 a 34,7 millones** de personas (1990→2023, **x2,28**), con un pico de **35,6 M en 2022**; la emigración de Ucrania se **multiplicó por 13,9** en 2022 con la invasión rusa. Y la incertidumbre, de apenas **2% global**, se **multiplica por 7 país por país** (mediana 15%): se cancela al sumar. ⚠️ Toda cifra es **estimación de un modelo**, no un conteo directo. ⚠️ El modelo supera estimaciones previas de 5 años en datos reservados, pero la **magnitud exacta no se extrajo**. ⚠️ Los flujos describen **cuánta gente se movió, no por qué** — sin causalidad.
