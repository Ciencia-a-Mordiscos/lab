titulo_corto: "Una onda sísmica que movió Japón entero"
card_descripcion: |
  El terremoto de Tohoku-Oki de 2011 (Mw 9,0) lanzó una onda de corte tan fuerte que bajó hasta el núcleo de la Tierra, rebotó y volvió a la superficie. Al reaparecer en Japón —ya como onda **ScS**—, los GPS registraron un **escalón hacia el este de hasta 5 a 6 mm** en todo el país. **El hallazgo:** el salto apareció en **104 estaciones (8,5%)** de Hokkaido a Okinawa y ocurrió **casi al mismo tiempo** (mediana 110 s, rango 92-128 s) en más de 2.000 km, decayendo con la distancia a la ruptura (Spearman ρ = −0,73). ⚠️ Las series que exploramos son **sintéticas** (salida de modelo): reproducen el escalón pero se quedan en 4,79 mm, algo por debajo del observado. ⚠️ Que la ScS *disparara* el deslizamiento es la **interpretación** del paper (*likely*), no una medición — estudio observacional. ⚠️ El peligro sísmico se plantea como posibilidad (*potentially*).
