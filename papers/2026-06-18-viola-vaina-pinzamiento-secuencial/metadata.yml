card_descripcion: |
  Muchas plantas lanzan sus semillas como una catapulta, pero ese disparo suele ser caótico: cada semilla sale con una fuerza distinta. Las violetas (*Viola* spp.) resolvieron eso apretando (*pinzando*) las semillas una tras otra, con fuerza pareja, gracias a la forma de la cáscara de su vaina. Kim et al. midieron 5 especies y separaron dos estrategias. **El hallazgo:** las violetas que disparan tienen la cáscara **~4 veces más rígida (58 vs 14 MPa) pero un 62% más delgada** que las dispersadas por hormigas — logran fuerza con menos material. Y el mismo principio funciona en valvas artificiales a lo largo de **4,4 órdenes de magnitud** de rigidez. ⚠️ Muestra chica (**3 vs 2 especies**): el contraste se sostiene en tamaños de efecto grandes (Cohen's d = 2–3,6), **no** en significancia estadística. ⚠️ Estudio **observacional** entre especies: están construidas distinto, no que disparar lo cause.
