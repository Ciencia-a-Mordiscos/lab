titulo_corto: "GW250114: la huella del horizonte de un agujero negro"
card_descripcion: |
  Un agujero negro arrastra el espacio a su alrededor: cualquier cosa que cruza su horizonte parece girar a una misma velocidad, la del propio horizonte. GW250114, una de las fusiones más ruidosas jamás detectadas, trajo escondida una "onda directa" que lleva esa firma. **El hallazgo:** la onda aparece con **SNR de filtro adaptado ≈ 15,8 (Hanford) / 17,1 (Livingston)**, y sus dos cocientes característicos convergen en **1** cerca de la fusión — la onda oscila a la velocidad de arrastre del horizonte (2·Ω_H) y se apaga a su gravedad superficial (κ), la firma de un agujero negro de Kerr. El remanente: **~63 masas solares** girando a **dos tercios** del máximo, tras radiar **~3,12 masas solares** en ondas gravitacionales. ⚠️ Es un solo evento, de los más fuertes registrados; la onda directa es tenue y solo se ve por esa potencia excepcional. ⚠️ Los cocientes de la huella salen del modelo analítico del paper normalizado con el espín del remanente (χ_f = 0,6725), no de una medición independiente del horizonte. ⚠️ El paper la enmarca como *primera evidencia* observacional de su clase, aún no repetida en muchos eventos.
