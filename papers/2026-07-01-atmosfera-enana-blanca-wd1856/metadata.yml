titulo_corto: "La atmósfera de un planeta que orbita una enana blanca"
card_descripcion: |
  Cuando una estrella como el Sol muere, deja una enana blanca del tamaño de la Tierra. WD 1856 b es un planeta gigante que sobrevivió a esa muerte y hoy la orbita tan de cerca que, al pasar por delante, **tapa 51–56% de su luz** — el tránsito más profundo conocido, porque el planeta es más grande que la estrella. El James Webb aprovechó ese eclipse descomunal para leer su atmósfera. **El hallazgo:** el espectro revela aerosoles e hidrocarburos, acota la masa a **4,3–10,9 masas de Júpiter** y mide una temperatura efectiva de **~390–412 K**, unos **242 K por encima** de los 160 K de equilibrio esperados. ⚠️ El metano es el candidato preferido con evidencia moderada (odds 17:1–30:1), no una detección confirmada. ⚠️ Masa y temperatura salen de ajustar modelos al espectro (por eso dos pipelines independientes). ⚠️ Todo apunta a un recalentamiento hace 3,0–5,5 Gyr, pero es una inferencia de modelos de enfriamiento, no una medición.
