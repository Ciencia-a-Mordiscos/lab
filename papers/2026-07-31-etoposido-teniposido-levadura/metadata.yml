titulo_corto: "Fabricar un medicamento contra el cáncer en levadura"
card_descripcion: |
  El etopósido, medicamento esencial de primera línea contra el cáncer de pulmón de células pequeñas, hoy depende de arrancar una planta del Himalaya en peligro de extinción. Un equipo reconstruyó esa ruta dentro de la levadura de cerveza — **más de 60 ediciones genéticas** y **45 enzimas** — para fabricar el precursor en un tanque. **El hallazgo:** la levadura ya produce **12 lignanos distintos**; el glucósido estrella llega a **1.620 µg/L**, pero el precursor real del etopósido se queda en **132 µg/L** — **12× menos**, todavía el cuello de botella. ⚠️ Son concentraciones de una sola tanda de fermentación (prueba de concepto), no rendimientos a escala industrial. El paper usa verbos constructivos (*reconstructed*, *established*): reconstruyeron y midieron el sistema.
