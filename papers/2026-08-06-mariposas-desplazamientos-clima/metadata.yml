titulo_corto: "1.758 mariposas que cambiaron de sitio"
card_descripcion: |
  Nadie salió al campo: un equipo revisó **567 estudios en quince idiomas** más **68 evaluaciones de expertos** y armó el inventario más grande de mariposas que se corrieron de lugar — **1.758 especies en 105 países**, el **9,1%** de la diversidad conocida. **El hallazgo:** el **81,2%** ganó terreno, pero el **65%** de las especies entró a la lista con **un solo registro, de un solo estudio, en un solo país**; solo **94** (5%) tienen más de diez registros independientes. Un detalle que se ve en los datos: **1.427 + 480 + 381 = 2.288** sobre 1.758 especies, porque **409** hacen más de una cosa según dónde se las mire — y cuatro suben **y** bajan de altitud. ⚠️ El título del paper dice *climate-induced* pero el resumen dice *associated with*: es **asociación**, no causa. ⚠️ El **79%** del clima sale de 278 sobre las **352 especies con amenaza atribuida**, que son el 20,0% del total — no del planeta. ⚠️ Los porcentajes por país miden **cobertura de documentación**, no prevalencia: el mapa dice dónde hay gente contando mariposas.
