titulo_corto: "El carro que todavía sirve"
card_descripcion: |
  Tu carro prende, gasta lo de siempre y le quedan años. Cambiarlo por uno eléctrico suena a desperdicio: la batería nueva llega con emisiones de fábrica que el que ya tienes dejó pagadas. Un equipo hizo la cuenta de ciclo de vida para **210 combinaciones** de vehículo retirado, eléctrico de reemplazo y red eléctrica. **El hallazgo:** en **160 de las 210** (76,2%) chatarrizar el carro que todavía funciona emite menos — pero el resultado no vive en el carro, vive en el enchufe: la mediana pasa de **54,5%** en California a **41%** con el promedio de EE. UU. y a **3,5%** en Puerto Rico. Un detalle que se ve en los datos: manejando, el eléctrico emite menos en **las 27 subredes** del país (la peor empataría a 723 g CO₂/kWh y está en 699) — toda la discusión está en fabricar la batería. ⚠️ El bloque rojo son los **híbridos**: retirar uno deja mediana **20%** frente al 50% de los que no lo son, y con red sucia cae a **−29,5%**. ⚠️ El **92%** que cita el paper sale de su análisis continuo, no de estas tablas: nuestra matriz discreta da 76,2%. No son la misma métrica. ⚠️ Es un **modelo** de ciclo de vida, no una medición, y todo es Estados Unidos. Su propuesta es de **política pública** — el propio resumen dice que hoy chatarrizar sigue siendo económicamente prohibitivo para el dueño.
