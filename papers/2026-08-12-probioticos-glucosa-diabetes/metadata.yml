titulo_corto: "Un probiótico que solo trabaja cuando el azúcar sube"
card_descripcion: |
  Le instalaron a la bacteria del probiótico un circuito que lee el azúcar: cuando la glucosa sube, fabrica GLP-1. Se toma por la boca y sale. Cinco monos diabéticos la tomaron 34 días. **El hallazgo:** la glucosa en ayunas bajó de **15,16 a 10,57 mM (−30,3%)** y los **5 de 5** bajaron — pero los monos sanos están en **5,07 mM**, así que los tratados quedan **5,50 mM por encima**: cierran el **44,5%** del camino, no se curan. El sensor no es un dial sino un interruptor: mudo hasta 5 mM, **9,9 veces** más señal al llegar a 10 (d = 6,33). Y sí distingue comida real: la Coca-Cola sube la glucemia del ratón **+6,27 mM**, la dietética **+0,43** (indistinguible del control). ⚠️ El p = 0,0045 de la glucosa en ayunas es **cálculo nuestro** — la tabla estadística del paper no lista test para ese panel; el del área bajo la curva (p = 0,0123) sí reproduce el suyo exactamente. ⚠️ Uno de los cinco monos apenas se movió (−4%). ⚠️ Con n = 5 el Wilcoxon no baja de p = 0,0625. ⚠️ **En personas no se ha probado**: está en el título del paper.
