card_descripcion: |
  China empujó los paneles solares con políticas de provincia, municipio y condado. Zhang et al. cruzaron ese empuje contra listas de aves de ciencia ciudadana en **2.344 condados** por **120 meses**. **El hallazgo:** donde la política apretó más fuerte, un condado pierde **unas 4 especies de aves** por cada desviación estándar de rigor (11,3 por ciento de su riqueza) mientras su **índice de área foliar sube** — más hoja por metro cuadrado, menos verdor y menos diversidad, lo que los autores bautizaron *enverdecimiento inferior*. El notebook rehace las 21 regresiones del paquete de réplica con `reghdfe` reescrito en numpy, y marca lo que **no** se pudo reproducir: la conversión de suelo que el abstract da como mecanismo.
