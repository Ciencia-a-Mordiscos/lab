titulo: "Un ratón con el córtex casi entero de células humanas. ¿Camina igual?"
titulo_corto: "Córtex humano en ratón"
card_descripcion: |
  Vaciaron el córtex de un ratón de sus neuronas excitadoras y lo rellenaron con organoides humanos: a los 3 meses el 91,9% del tejido cortical era humano y el injerto había crecido 4,7× en un mes (mediana 3,77×). La velocidad de carrera no cambia (p = 0,85) pero sí la coordinación de las patas (p = 0,0039), y los xenocorticales alternan en el laberinto por encima del azar. ⚠️ El mapa espacial MERFISH de Zenodo se descartó: anotación colapsada por bloques.
fecha: 2026-09-16
