titulo: "¿Sembrar árboles o cuidar los que ya están? En la Amazonía, restaurar rinde una cuarta parte"
titulo_corto: "Proteger vs restaurar la Amazonía"
card_descripcion: |
  En 6.900 fincas de la frontera de deforestación brasileña, un modelo contrafactual 2010-2020 dice que evitar la tala y el fuego aporta 2,28 veces la biodiversidad que aporta evitar la deforestación, y que restaurar rinde 0,26 veces. Replicamos la figura central: restaurar solo gana en fincas con menos del 42,7 % (biodiversidad) y 41,1 % (carbono) de bosque. ⚠️ Beneficios modelados, no observados; las sumas cubren solo las fincas del catastro, no el paisaje completo.
