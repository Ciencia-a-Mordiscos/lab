    titulo: "Advancing mathematics research with AI-driven formal proof search"
    journal: Science
    autores: "Tsoukalas et al."
    verificado: true
reproducible: true
datos_publicos: true
datasets:
  - nombre: "pruebas_lean.csv"
    descripcion: "71 archivos Lean publicados (69 pruebas completas, 2 parciales): dominio, líneas de código, lemas auxiliares, respuesta formal"
    fuente: "Zenodo (doi:10.5281/zenodo.21477349), parseado"
  - nombre: "tacticas_por_prueba.csv"
    descripcion: "Conteo léxico de 30 tácticas de Lean por archivo (2.130 filas)"
    fuente: "Zenodo (doi:10.5281/zenodo.21477349), parseado"
  - nombre: "problemas_intentados.csv"
    descripcion: "353 problemas de Erdős y 492 conjeturas OEIS que el agente intentó"
    fuente: "Zenodo + GitHub google-deepmind/formal-conjectures (THEOREM_MAPPING.txt)"
  - nombre: "comparacion_sistemas_erdos.csv"
    descripcion: "Problemas de Erdős resueltos por otros sistemas (de los 9), transcrito del material suplementario"
    fuente: "Supplementary Materials, pp. S10-S11"
